   expect: {status: refused, reason: off_topic}}
- {id: en-16, lang: en, text: "Can you handle this one for me?",
   expect: {status: refused, reason: too_vague}}
- {id: en-17, lang: en, text: "Same as last time.",
   expect: {status: refused, reason: too_vague}}
- {id: en-18, lang: en, text: "Formation of a new company: ID card, proof of address, criminal record extract and the bank capital certificate, within 14 days.",
   expect: {status: request, documents: [ID_DOCUMENT, PROOF_OF_ADDRESS, CRIMINAL_RECORD, BANK_CAPITAL_CERTIFICATE], due_in_days: 14}}

